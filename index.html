  2() {
    $('bConnect').onclick = async () => {
      const url = $('fUrl').value.trim().replace(/\/$/, ''), key = $('fKey').value.trim();
      const p = keyProblem(url, key);
      if (p) return status('st2', 'bad', p);
      S.url = url; S.key = key; save();
      status('st2', 'wait', 'Checking your project...');
      try {
        const c = await client();
        const { error } = await c.from('businesses').select('id').limit(1);
        if (error && !isMissingTable(error)) {
          if (/Invalid API key|JWT|apikey/i.test(error.message)) return status('st2', 'bad', 'The key does not match this project. Copy both from the same project.');
          throw error;
        }
        S.done[2] = 1; save();
        status('st2', 'ok', '<b>Connected.</b> Your project answered. Click Next.');
        document.querySelector('[data-act=next]').disabled = false;
      } catch (e) {
        status('st2', 'bad', isNetwork(e) ? 'Could not reach that Project URL. Check for typos and that the project finished setting up.' : 'Something went wrong: ' + esc(e.message || e));
      }
    };
  },
  4() {
    $('bCopySql').onclick = () => {
      const em = $('fEmail').value.trim().toLowerCase();
      if (!/^[^\s@'"\\]+@[^\s@'"\\]+\.[^\s@'"\\]+$/.test(em)) return status('st4', 'bad', 'Type a valid email first.');
      S.email = em; save();
      const sql = SUITE_SQL.replace(EMAIL_MARK, em);
      copy(sql, 'Engine');
      status('st4', 'next', '<b>Engine copied</b> with <b>' + esc(em) + '</b>. Your turn: click <b>Open SQL Editor</b>, click <b>New query</b>, paste, click <b>Run</b> and wait for "Pahina Suite is ready". Then come back and click <b>Check</b>.');
    };
    $('bCheckSql').onclick = async () => {
      if (!S.email) return status('st4', 'bad', 'Type your email and click Copy the engine first.');
      status('st4', 'wait', 'Looking for the engine...');
      try {
        const c = await client();
        const r = await Promise.all([
          c.from('businesses').select('id').limit(1),
          c.from('po_shops').select('id').limit(1),
          c.rpc('default_bot_id')
        ]);
        const names = ['Book', 'Orders + Stock', 'AI'];
        const missing = r.map((x, i) => x.error ? names[i] : null).filter(Boolean);
        if (missing.length) return status('st4', 'bad', 'Not installed yet: <b>' + missing.join(', ') + '</b>. Paste the engine in the SQL Editor, click Run, wait for "Pahina Suite is ready", then check again.');
        S.done[4] = 1; save();
        status('st4', 'ok', '<b>Engine installed.</b> Book, Orders + Stock and AI are ready. Click Next.');
        document.querySelector('[data-act=next]').disabled = false;
      } catch (e) { status('st4', 'bad', isNetwork(e) ? 'Could not reach your project. Check your internet.' : esc(e.message || e)); }
    };
  },
  5() {
    const btn = $('bAcct');
    btn.onclick = async () => {
      const pw = $('fPw').value;
      if (pw.length < 8) return status('st5', 'bad', 'Use at least 8 characters.');
      if (!S.email) return status('st5', 'bad', 'Your email is missing. Go back to Step 5, type your email and copy the engine again.');
      btn.disabled = true;
      try {
        status('st5', 'wait', 'Checking your Step 4 setting...');
        /* 1. Stop before sending anything if Confirm email is still ON (this is what causes the rate limit). */
        let st = null; try { st = await authSettings(); } catch (e) {}
        if (st) {
          const p = settingsProblem(st);
          if (p) return status('st5', 'bad', p + '<br><a class="btn sec" href="' + dash('/auth/providers') + '" target="_blank" rel="noopener">Open sign-in settings</a>');
        }
        status('st5', 'wait', 'Creating your account...');
        const c = await client();
        let session = null;
        /* 2. Try to log in first. If the account already exists, no sign-up is needed. */
        const first = await c.auth.signInWithPassword({ email: S.email, password: pw });
        if (!first.error) session = first.data.session;
        else if (/not confirmed/i.test(first.error.message)) return confirmFix();
        else {
          const up = await c.auth.signUp({ email: S.email, password: pw });
          if (up.error && !/already registered|already exists|user_already_exists/i.test(up.error.message + ' ' + (up.error.code || ''))) return status('st5', 'bad', friendly(up.error));
          session = up.data && up.data.session;
          if (!session) {
            const inn = await c.auth.signInWithPassword({ email: S.email, password: pw });
            if (inn.error) {
              if (/not confirmed/i.test(inn.error.message)) return confirmFix();
              if (/Invalid login/i.test(inn.error.message)) return status('st5', 'bad', 'This email already has an account with a <b>different password</b>. Type the password you used before. Forgot it? Click <b>Message Levi</b> below.');
              return status('st5', 'bad', friendly(inn.error));
            }
            session = inn.data.session;
          }
        }
        const adm = await c.rpc('is_admin');
        if (adm.error) return status('st5', 'bad', friendly(adm.error));
        if (!adm.data) return status('st5', 'bad', 'You are logged in, but this email is not the owner in the engine. Go back to Step 5, type <b>this same email</b>, copy and run the engine again.');
        S.done[5] = 1; save();
        status('st5', 'ok', '<b>Account ready.</b> You are the owner of all your Pahina tools. Click Next.');
        document.querySelector('[data-act=next]').disabled = false;
      } catch (e) { status('st5', 'bad', friendly(e)); }
      finally { btn.disabled = false; }
    };
  },
  6() {
    $('bCopyFn').onclick = () => copy(CHAT_FN, 'AI code');
    $('bCheckFn').onclick = async () => {
      status('st6', 'wait', 'Saying hello to your AI chat...');
      const r = await pingChat();
      if (r.status === 404) return status('st6', 'bad', 'No function named <b>chat</b> yet. Check that the name is exactly "chat" and that it finished deploying.');
      if (r.status === 401 || r.status === 403) return status('st6', 'bad', 'The function is there, but <b>Verify JWT</b> is still ON. Turn it off in the function settings, save, then check again.');
      if (!r.ok && !r.status) {
        if (await chatAlive()) { S.done[6] = 1; save(); status('st6', 'ok', '<b>AI chat is on.</b> Next, give it a brain: your Gemini key.'); document.querySelector('[data-act=next]').disabled = false; return; }
        /* The browser blocked the answer. Usually Verify JWT is still ON, the name is not exactly chat, or it is still deploying. */
        let online = true; try { await fetch(S.url + '/auth/v1/health', { mode: 'no-cors' }); } catch (e) { online = false; }
        if (!online) return status('st6', 'bad', 'Could not reach your project. Check your internet, then click Check again.');
        const u = S.url + '/functions/v1/chat';
        return status('st6', 'bad', '<b>Your project answered, but the chat function did not let us in.</b> Find out why in 10 seconds:' +
          '<ol><li>Click <b>Open my chat test</b> below. A new tab opens.</li>' +
          '<li>If it says <b>Missing authorization header</b> or <b>Invalid JWT</b>: Verify JWT is still ON. In Supabase open Edge Functions, click <b>chat</b>, open <b>Details</b> (or Settings), turn <b>Verify JWT</b> (it may say "Enforce JWT verification" or "Verify JWT with legacy secret") <b>OFF</b>, then click <b>Save changes</b> at the bottom.</li>' +
          '<li>If it says <b>Requested function was not found</b>: the name is not exactly <b>chat</b>. Deploy a new function named <b>chat</b> (small letters).</li>' +
          '<li>If it shows <b>"v"</b> and <b>"error":"method"</b>: the function is fine. Wait 30 seconds, then click Check again.</li></ol>' +
          'Then come back here and click <b>Check</b>.<br><a class="btn sec" href="' + u + '" target="_blank" rel="noopener">Open my chat test</a>');
      }
      if (!r.ok) return status('st6', 'bad', 'The function answered with an error (' + r.status + '). Deploy it again, then check.');
      if (!r.body || !r.body.v) return status('st6', 'bad', 'Your <b>chat</b> function is an <b>older version</b>. Click <b>Copy the AI code</b> again, open your <b>chat</b> function, click <kbd>Code</kbd>, delete everything, paste, then click <kbd>Deploy</kbd>. Wait until it says deployed, then click Check.');
      S.done[6] = 1; save();
      status('st6', 'ok', '<b>AI chat is on.</b> Next, give it a brain: your Gemini key.');
      document.querySelector('[data-act=next]').disabled = false;
    };
  },
  7() {
    $('bGem').onclick = async () => {
      const k = $('fGem').value.trim();
      if (!/^(AIza[\w-]{20,}|AQ\.\S{20,})$/.test(k)) return status('st7', 'bad', 'That does not look like a Gemini key. It starts with "AQ." (or "AIza" for older keys), with no spaces.');
      status('st7', 'wait', 'Saving your key...');
      try {
        const c = await client();
        const { data: s } = await c.auth.getSession();
        if (!s || !s.session) return status('st7', 'bad', 'Your login expired. Go back to Step 6 and log in again, then come back.');
        const r = await c.rpc('set_secret', { p_key: 'gemini_key', p_value: k });
        if (r.error) throw r.error;
        $('fGem').value = '';
        status('st7', 'wait', 'Key saved. Testing your AI...');
        const t = await pingChat();
        const reply = (t.body && t.body.reply) || '';
        if (t.ok && reply && !/not set up yet|not available right now|Hindi pa naka-set up|hindi available ang AI/i.test(reply)) {
          S.done[7] = 1; save();
          status('st7', 'ok', '<b>Your AI answered:</b> "' + esc(reply.slice(0, 160)) + '"');
          document.querySelector('[data-act=next]').disabled = false;
        } else {
          status('st7', 'bad', geminiHelp(t));
        }
      } catch (e) { status('st7', 'bad', isNetwork(e) ? 'Could not reach your project. Check your internet.' : esc(e.message || e)); }
    };
  },
  8() {
    $('bCopyLink').onclick = () => copy(links().connect, 'Connect link');
    const wake = () => S.url.replace(/\/+$/, '') + '/rest/v1/?apikey=' + encodeURIComponent(S.key);
    $('bWakeCopy').onclick = () => copy(wake(), 'Wake-up link');
    $('bWakeCheck').onclick = async () => {
      status('stWake', 'wait', 'Checking your project...');
      try { const r = await fetch(wake()); status('stWake', r.ok ? 'ok' : 'bad', r.ok ? 'Your project is awake and working.' : 'Your project did not answer (' + r.status + '). Open your Supabase project and click Resume project if it is paused.'); }
      catch (e) { status('stWake', 'bad', 'Your project did not answer. Open your Supabase project and click Resume project if it is paused.'); }
    };
    $('bShopSave').onclick = () => {
      const v = ($('fShop').value || '').trim().replace(/[?#].*$/, '').replace(/\/+$/, '');
      if (v && !/^https:\/\/[^\s/]+\.[^\s]+$/i.test(v)) return status('stShop', 'bad', 'Paste the full link of your store, starting with https://');
      S.shop = v; save(); render();
    };
    document.querySelectorAll('[data-shopchk]').forEach((c) => c.addEventListener('change', () => { S.shopChk = S.shopChk || {}; S.shopChk[c.dataset.shopchk] = c.checked ? 1 : 0; save(); }));
  }
};

/* The account was made while "Confirm email" was ON, so it waits for an email.
   One SQL line confirms it, with no email needed. */
function confirmFix() {
  status('st5', 'bad', '<b>Your account was made earlier, but it is still waiting for a confirmation email.</b> You can confirm it yourself in 3 clicks:' +
    '<ol><li>Click <b>Copy the fix</b>.</li><li>Click <b>Open SQL Editor</b>, paste, then click <b>Run</b>.</li><li>Come back and click <b>Create my account</b> again.</li></ol>' +
    '<button class="btn sec" id="bFix" type="button">Copy the fix</button> <a class="btn sec" href="' + dash('/sql/new') + '" target="_blank" rel="noopener">Open SQL Editor</a>');
  const b = $('bFix'); if (b) b.onclick = () => copy(fixSql(), 'Fix');
}

/* Turns Google's real error into a clear next step. */
function geminiHelp(t) {
  const b = (t && t.body) || {};
  if (t && t.slow) return '<b>Your key is saved.</b> Gemini is taking long to answer right now. Wait 1 minute, then click <b>Save and test my AI</b> again. If it keeps happening, click <b>Message Levi</b>.';
  if (!t || !t.ok) return t && t.status === 404 ? 'Your <b>chat</b> function was not found. Go back to Step 7 and deploy it again.' : '<b>Your key is saved, but the AI chat stopped while answering.</b> Wait 1 minute and click <b>Save and test my AI</b> again. Still the same? In Supabase open <b>Edge Functions</b>, click <b>chat</b>, open <b>Logs</b>, take a screenshot of the newest red line and send it with <b>Message Levi</b>.';
  if (!b.v) return 'Your key was saved, but your <b>chat</b> function is an <b>older version</b> that cannot use new Gemini models. Go back to <b>Step 7</b>, click <b>Copy the AI code</b>, open your <b>chat</b> function, click <kbd>Code</kbd>, delete everything, paste, click <kbd>Deploy</kbd>. Then come back and click <b>Save and test my AI</b> again.';
  if (/not set up yet/i.test(b.reply || '')) {
    const d = b.error_detail || {};
    const redeploy = '<ol><li>Click <b>Back</b> to Step 7 (Turn on AI chat) and click <b>Copy the AI code</b>.</li><li>In Supabase open <b>Edge Functions</b>, click <b>chat</b>, open the <b>Code</b> tab, delete everything, paste, then click <b>Deploy</b>. Verify JWT stays OFF.</li><li>Come back here, paste your key again and click <b>Save and test my AI</b>.</li></ol>';
    if (!d.stage) return '<b>Your key is saved, but your chat function is an older copy.</b> Update it once (1 minute):' + redeploy;
    if (/permission denied|42501/i.test(d.message || '')) return '<b>Your key is saved, but your database blocks the AI chat.</b> Run the engine once more: click <b>Install the engine</b> on the left, click <b>Copy the engine</b>, paste it in a <b>New query</b> in the SQL Editor, click <b>Run</b>, then come back and click <b>Save and test my AI</b>.';
    return '<b>Your AI chat could not finish its setup.</b> It says: "' + esc(d.message || '') + '". Click <b>Message Levi</b> below; this message is copied for you.';
  }
  const g = b.error_detail || {};
  const all = [g.reason, g.status, g.message].join(' ');
  let fix;
  if (g.http === 401 || /API_KEY_INVALID|ACCESS_TOKEN_TYPE_UNSUPPORTED|api key not valid|UNAUTHENTICATED/i.test(all))
    fix = '<b>Google says this key is not valid.</b> Open <b>Get a free key</b>, click <kbd>Copy key</kbd> on your key (copy the whole key, no spaces), paste it here and try again. Still not working? Click <kbd>Create API key</kbd> to make a new one.';
  else if (/SERVICE_DISABLED|has not been used|is disabled|API_KEY_SERVICE_BLOCKED/i.test(all))
    fix = '<b>The Gemini API is turned off for this key.</b> In Google AI Studio, click <kbd>Create API key</kbd> and choose <b>Create API key in new project</b>. Paste the new key here.';
  else if (/location is not supported|FAILED_PRECONDITION/i.test(all))
    fix = '<b>Google does not allow the free Gemini API for this key\'s project or location.</b> Make a new key in Google AI Studio in a new project. If it still fails, click <b>Message Levi</b>.';
  else if (g.http === 429 || /RESOURCE_EXHAUSTED|quota/i.test(all))
    fix = /per day|PerDay|daily/i.test(all)
      ? '<b>Your free Gemini limit for today is used up.</b> It resets every day around 3 to 4 PM Philippine time. Try again after that. Your key is already saved.'
      : '<b>Gemini is busy or your free limit per minute was reached.</b> Wait 1 minute, then click <b>Save and test my AI</b> again. Your key is already saved.';
  else if (g.status === 'EMPTY')
    fix = '<b>Gemini answered, but with no text.</b> Click <b>Save and test my AI</b> again. If it keeps happening, click <b>Message Levi</b>.';
  else if (g.http === 404)
    fix = '<b>None of the Gemini models are available for this key.</b> Make a new key in Google AI Studio, paste it here and try again.';
  else
    fix = '<b>Gemini did not answer.</b> Try again in 1 minute. If it keeps happening, click <b>Message Levi</b>.';
  const real = g.message ? '<div class="help" style="margin-top:8px">Google says: ' + esc((g.http ? g.http + ' ' : '') + (g.status ? g.status + ' · ' : '') + g.message) + (g.model ? ' (model: ' + esc(g.model) + ')' : '') + '</div>' : '';
  return fix + real;
}

async function pingChat() {
  try {
    const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 90000);
    const r = await fetch(S.url + '/functions/v1/chat', {
      signal: ac.signal,
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: S.key, Authorization: 'Bearer ' + S.key },
      body: JSON.stringify({ messages: [{ role: 'user', text: 'Hi! Please reply with one short sentence.' }] })
    });
    let body = null; try { body = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, body };
  } catch (e) { return { ok: false, status: 0, body: null, slow: !!(e && e.name === 'AbortError') }; }
}
/* Simple GET (no preflight). The chat function answers {"v":...,"error":"method"} when it is deployed and Verify JWT is OFF. */
async function chatAlive() {
  try { const r = await fetch(S.url + '/functions/v1/chat'); const b = await r.json(); return !!(b && b.v); } catch (e) { return false; }
}

/* ---------------- render ---------------- */
function render() {
  rail();
  $('card').innerHTML = VIEWS[S.step]();
  const back = document.querySelector('[data-act=back]'), next = document.querySelector('[data-act=next]'), restart = document.querySelector('[data-act=restart]');
  if (back) back.onclick = () => go(S.step - 1);
  if (next) next.onclick = () => finish(S.step);
  if (restart) restart.onclick = () => go(1);
  document.querySelectorAll('[data-act=stuck]').forEach((a) => a.addEventListener('click', () => {
    const msg = 'Hi Levi! I am setting up Pahina Connect and I am stuck on Step ' + (S.step + 1) + ' of ' + STEPS.length + ': ' + STEPS[S.step].t + '.' +
      (lastErr ? ' The message I see: "' + lastErr + '"' : '');
    copy(msg, 'Your message');
  }));
  lastErr = '';
  if (ACTIONS[S.step]) ACTIONS[S.step]();
}

/* ---------------- theme ---------------- */
function setTheme(t) { document.body.classList.toggle('light', t === 'light'); $('themeBtn').textContent = t === 'light' ? 'Dark' : 'Light'; try { localStorage.setItem('pahina-connect-theme', t); } catch (e) {} }
$('themeBtn').onclick = () => setTheme(document.body.classList.contains('light') ? 'dark' : 'light');
let th = null; try { th = localStorage.getItem('pahina-connect-theme'); } catch (e) {}
setTheme(th || 'dark');

render();
</script>
