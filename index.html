<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pahina Connect</title>
<meta name="description" content="One setup for Pahina Book, Pahina Orders + Stock and Pahina AI. Part of the Pahina Builder Suite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1115;--bg2:#15181E;--bg3:#1B1F27;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --ink:#E8EAEE;--mute:#8B93A1;--faint:#5E6673;
  --acc:#7C74F0;--acc2:#A9A3F7;--accdim:rgba(124,116,240,.12);
  --ok:#2FB673;--okdim:rgba(47,182,115,.12);--warn:#E0A43B;--bad:#E5677D;--baddim:rgba(229,103,125,.12);
  --hi:inset 0 1px 0 rgba(255,255,255,.14);--r:12px;
  --glass:color-mix(in srgb,var(--bg2) 78%,transparent);
}
body.light{
  --bg:#F5F6F8;--bg2:#FFFFFF;--bg3:#F1F3F6;--line:#E4E7EC;--line2:#D0D5DD;
  --ink:#141821;--mute:#667085;--faint:#98A2B3;
  --acc:#5B50E8;--acc2:#4F46D6;--accdim:rgba(91,80,232,.08);--hi:inset 0 1px 0 rgba(255,255,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:400 15px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc2)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:var(--hi)}
.bname{font-weight:700;font-size:15px}.bsub{font-size:12px;color:var(--mute)}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--mute);cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--line2)}
.wrap{max-width:1080px;margin:0 auto;padding:32px 24px 80px;display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start}
.rail{position:sticky;top:84px}
.rail ol{list-style:none;display:flex;flex-direction:column;gap:2px}
.rail li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--faint);font-weight:500;cursor:default}
.rail li.done{color:var(--mute);cursor:pointer}.rail li.done:hover{background:var(--bg3)}
.rail li.on{background:var(--accdim);color:var(--ink);font-weight:600}
.rail .n{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.rail li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rail li.on .n{background:var(--acc);border-color:var(--acc);color:#fff}
.mprog{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:14px}
.mprog .mtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mprog .left{color:var(--faint);font-weight:500}
.mbar{height:5px;border-radius:99px;background:var(--bg3);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .3s}
.stuck{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding:12px 14px;border:1px dashed var(--line2);border-radius:var(--r);font-size:13.5px;color:var(--mute)}
.stuck .btn{padding:8px 14px;font-size:13.5px}
.status .t .btn{margin-top:10px;padding:8px 14px;font-size:13.5px}
.status .t ol{margin:6px 0 0 18px}
/* picture guide: a drawn copy of the Supabase screen */
.sb{border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin:6px 0 20px;background:#1C1C1C;color:#EDEDED;font-size:13px}
.sb .sbtop{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#141414;border-bottom:1px solid #2E2E2E}
.sb .sbdots{display:flex;gap:5px}.sb .sbdots i{width:8px;height:8px;border-radius:50%;background:#3A3A3A;display:block}
.sb .sbpath{font-size:12px;color:#9A9A9A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .sbbody{display:grid;grid-template-columns:150px 1fr;min-height:150px}
.sb .sbbody.one{grid-template-columns:1fr}
.sb .side{background:#171717;border-right:1px solid #2E2E2E;padding:10px 8px;display:flex;flex-direction:column;gap:3px}
.sb .side span{padding:6px 8px;border-radius:6px;color:#9A9A9A;font-size:12.5px;position:relative}
.sb .side span.on{background:#2A2A2A;color:#fff}
.sb .main{padding:14px;display:flex;flex-direction:column;gap:9px}
.sb .ttl{font-weight:600;font-size:14px;color:#fff;margin-bottom:2px}
.sb .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid #2E2E2E;border-radius:8px;background:#1F1F1F;position:relative}
.sb .r small{color:#8F8F8F;font-size:11.5px;display:block}
.sb .val{font:500 11.5px ui-monospace,Menlo,monospace;color:#BDBDBD;background:#262626;border:1px solid #333;border-radius:6px;padding:3px 7px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .sbtn{display:inline-block;padding:5px 11px;border-radius:6px;background:#2A2A2A;border:1px solid #3A3A3A;font-size:12px;font-weight:600;color:#EDEDED;position:relative}
.sb .sbtn.g{background:#3ECF8E;border-color:#3ECF8E;color:#0B2016}
.sb .bad{opacity:.55}
.sb .hl{outline:2px solid var(--acc2);outline-offset:2px;box-shadow:0 0 0 6px rgba(124,116,240,.22)}
.sb .tap{position:absolute;right:-8px;top:-9px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--acc);color:#fff;font:700 11px/20px Inter,sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2}
.sb .tg{width:34px;height:19px;border-radius:99px;background:#3A3A3A;position:relative;flex-shrink:0}
.sb .tg::after{content:'';position:absolute;left:3px;top:3px;width:13px;height:13px;border-radius:50%;background:#fff}
.sb .tg.on{background:#3ECF8E}.sb .tg.on::after{left:18px}
.sb .ok{color:#3ECF8E;font-weight:600}
.sb figcaption{padding:9px 12px;border-top:1px solid #2E2E2E;background:#141414;color:#9A9A9A;font-size:12px}
.pic{margin:6px 0 20px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--bg3)}
.pic img{display:block;width:100%;height:auto}
.pic figcaption{padding:9px 12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
@media(max-width:860px){.sb .sbbody{grid-template-columns:1fr}.sb .side{flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid #2E2E2E}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:36px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.kicker{font-size:13px;font-weight:600;color:var(--acc2);margin-bottom:6px}
h1{font-size:28px;line-height:1.25;letter-spacing:-.01em;font-weight:700;margin-bottom:8px}
h2{font-size:24px;line-height:1.3;letter-spacing:-.01em;font-weight:700;margin-bottom:6px}
h3{font-size:16px;font-weight:700;margin-bottom:4px}
.lead{color:var(--mute);font-size:16px;margin-bottom:26px;max-width:62ch}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;margin:6px 0 22px}
.steps li{counter-increment:s;position:relative;padding:14px 16px 14px 52px;background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);font-size:15px}
.steps li::before{content:counter(s);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--accdim);color:var(--acc2);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps b,.lead b,.note b{color:var(--ink);font-weight:600}
kbd{display:inline-block;padding:1px 8px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;font:600 13px Inter,sans-serif;background:var(--bg2);color:var(--ink);white-space:nowrap}
.field{margin-bottom:18px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
.help{font-size:13px;color:var(--mute);margin-top:6px}
input[type=text],input[type=email],input[type=password],input[type=url]{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:15px;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accdim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,filter .2s,background .2s;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pri{background:var(--acc);color:#fff;box-shadow:var(--hi),0 8px 20px -10px var(--acc)}
.pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.sec{background:var(--bg3);color:var(--ink);border:1px solid var(--line);box-shadow:var(--hi)}
.sec:hover{border-color:var(--line2);transform:translateY(-1px)}
.ghost{background:transparent;color:var(--mute);padding:12px 10px}
.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);gap:10px;flex-wrap:wrap}
.status{display:none;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;font-size:14px;margin-top:14px}
.status.show{display:flex}
.status.ok{background:var(--okdim);color:var(--ok)}
.status.bad{background:var(--baddim);color:var(--bad)}
.status.wait,.status.next{background:var(--accdim);color:var(--acc2)}
.status .t{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:7px;flex-shrink:0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .8s linear infinite;margin-top:3px;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.note{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--mute);margin:16px 0}
.note.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 6px;background:var(--bg)}
.mock .mt{font-size:12px;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg3)}
.mock .mb{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}
.mrow.hl{border-color:var(--acc);box-shadow:0 0 0 3px var(--accdim)}
.tog{width:38px;height:22px;border-radius:999px;background:var(--line2);position:relative;flex-shrink:0}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.tog.on{background:#3ecf8e}.tog.on::after{left:19px}
.code{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:12px;word-break:break-all;color:var(--mute);max-height:120px;overflow:auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 22px}
.tool{background:var(--bg3);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.tool .ic{width:40px;height:40px;border-radius:10px;background:var(--accdim);color:var(--acc2);display:grid;place-items:center}
.tool .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool p{font-size:14px;color:var(--mute);flex:1}
.tool .btn{width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--okdim);color:var(--ok)}
.need{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 8px}
.need div{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;color:var(--mute)}
.need b{display:block;color:var(--ink);margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line2);color:var(--ink);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:860px){
  .wrap{grid-template-columns:1fr;padding:18px 16px 60px;gap:16px}
  .rail{display:none}
  .mprog{display:block;font-size:13px;color:var(--mute);font-weight:600}
  .mbar{height:5px;border-radius:99px;background:var(--bg3);margin-top:8px;overflow:hidden}
  .mbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
  .card{padding:22px 18px;border-radius:14px}
  h1{font-size:24px}h2{font-size:21px}
  .grid3,.need{grid-template-columns:1fr}
  .top{padding:10px 16px}.bsub{display:none}
  .nav .btn{flex:1}
}
.grid3.g4{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.grid3.g4{grid-template-columns:1fr}}
.storesteps{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65;color:inherit}
.storesteps li{margin:2px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  function lum(c){var m=(c||'').match(/[\d.]+/g);if(!m)return 1;return (0.2126*m[0]+0.7152*m[1]+0.0722*m[2])/255}
  function sync(){var b=document.body;if(!b)return;var d=lum(getComputedStyle(b).color)>0.55,h=document.documentElement;if(h.classList.contains('pahina-dark')!==d)h.classList.toggle('pahina-dark',d)}
  function init(){
    if(!document.getElementById('pahina-bg')){var el=document.createElement('div');el.id='pahina-bg';el.setAttribute('aria-hidden','true');document.body.insertBefore(el,document.body.firstChild)}
    sync();
    var q=0,o=new MutationObserver(function(){if(q)return;q=1;requestAnimationFrame(function(){q=0;sync()})});
    o.observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme']});
    o.observe(document.body,{attributes:true,attributeFilter:['class','data-theme']});
    try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sync)}catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

<script type="module">
/* =====================================================================
   PAHINA CONNECT v1.2 — Pahina Builder Suite
   The links of the apps this setup connects. Change them here if you
   move an app to a new address.
   ===================================================================== */
const APPS = {
  book:   'https://pahinabook.vercel.app/',
  orders: 'https://pahinaorder-stock-opal.vercel.app/',
  ai:     'https://pahinaai.vercel.app/',  // your hosted copy of the patched Pahina AI (index.html + setup.html)
  store:  'https://digiterashop-onboarding.vercel.app/'  // Pahina Store setup guide
};
const STORE_KEY = 'pahina-connect-v1';
const SUITE_SQL = "-- =====================================================================\n-- PAHINA SUITE ENGINE v1.1 (Supabase)\n-- One setup for: Pahina Book + Pahina Orders + Stock + Pahina AI\n--\n-- HOW TO USE\n--   1. Supabase Dashboard > SQL Editor > New query\n--   2. Paste ALL of this, then click Run.\n--   3. You should see: \"Pahina Suite is ready\".\n--\n-- BEFORE YOU RUN (new install only):\n--   Find the line with PUT-YOUR-ADMIN-EMAIL-HERE (Part 3) and change it\n--   to the email you will use to log in. The Pahina Builder guide does\n--   this for you. Use the SAME email for all Pahina tools.\n--\n-- SAFE TO RUN AGAIN: it never deletes your bookings, orders, stock,\n-- bots, leads or settings. Already using one of the apps in this\n-- project? Just run this; it adds the missing parts.\n--\n-- After this, Pahina AI still needs its \"chat\" Edge Function\n-- (chat-function.ts) and your Gemini key. See the guide.\n-- =====================================================================\n\n\n-- =====================================================================\n-- PART 1: PAHINA BOOK (bookings)\n-- =====================================================================\n\n-- =============================================================\n-- PAHINA BOOK \u2014 Supabase setup\n-- Paste ALL of this into Supabase > SQL Editor > New query, then click Run.\n-- Safe to run again: it will not delete your data.\n-- =============================================================\n\ncreate extension if not exists pgcrypto;\n\ncreate table if not exists public.businesses (\n  id uuid primary key default gen_random_uuid(),\n  owner_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  slug text not null unique,\n  data jsonb not null default '{}'::jsonb,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\ncreate table if not exists public.bookings (\n  id uuid primary key default gen_random_uuid(),\n  business_id uuid not null references public.businesses(id) on delete cascade,\n  owner_id uuid not null,\n  ref text not null,\n  date text not null,\n  start_time text not null,\n  status text not null default 'pending',\n  payment_status text not null default 'unpaid',\n  data jsonb not null default '{}'::jsonb,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists bookings_biz_idx on public.bookings (business_id, date);\n\ncreate table if not exists public.slot_locks (\n  business_id uuid not null references public.businesses(id) on delete cascade,\n  date text not null,\n  staff_key text not null,\n  block text not null,\n  booking_id uuid references public.bookings(id) on delete cascade,\n  primary key (business_id, date, staff_key, block)\n);\n\ncreate table if not exists public.proofs (\n  booking_id uuid primary key references public.bookings(id) on delete cascade,\n  owner_id uuid not null,\n  data_url text not null\n);\n\nalter table public.businesses enable row level security;\nalter table public.bookings enable row level security;\nalter table public.slot_locks enable row level security;\nalter table public.proofs enable row level security;\n\n-- Businesses: anyone can view (customers need it), only the owner can change.\ndrop policy if exists \"biz read\" on public.businesses;\ncreate policy \"biz read\" on public.businesses for select using (true);\ndrop policy if exists \"biz insert\" on public.businesses;\ncreate policy \"biz insert\" on public.businesses for insert to authenticated with check (owner_id = auth.uid());\ndrop policy if exists \"biz update\" on public.businesses;\ncreate policy \"biz update\" on public.businesses for update to authenticated using (owner_id = auth.uid()) with check (owner_id = auth.uid());\ndrop policy if exists \"biz delete\" on public.businesses;\ncreate policy \"biz delete\" on public.businesses for delete to authenticated using (owner_id = auth.uid());\n\n-- Bookings: only the owner can view and update. Customers book through create_booking().\ndrop policy if exists \"bk read\" on public.bookings;\ncreate policy \"bk read\" on public.bookings for select to authenticated using (owner_id = auth.uid());\ndrop policy if exists \"bk update\" on public.bookings;\ncreate policy \"bk update\" on public.bookings for update to authenticated using (owner_id = auth.uid()) with check (owner_id = auth.uid());\ndrop policy if exists \"bk delete\" on public.bookings;\ncreate policy \"bk delete\" on public.bookings for delete to authenticated using (owner_id = auth.uid());\n\n-- Time locks: anyone can see which times are taken (no customer details inside).\ndrop policy if exists \"lock read\" on public.slot_locks;\ncreate policy \"lock read\" on public.slot_locks for select using (true);\n\n-- Payment proofs: owner only.\ndrop policy if exists \"proof read\" on public.proofs;\ncreate policy \"proof read\" on public.proofs for select to authenticated using (owner_id = auth.uid());\n\n-- One safe door for customers to create a booking. Double booking is impossible:\n-- every 15-minute block is a unique row, so the second person gets SLOT_TAKEN.\ncreate or replace function public.create_booking(\n  p_business_id uuid,\n  p_booking jsonb,\n  p_staff_key text,\n  p_blocks text[],\n  p_proof text default null\n) returns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  v_owner uuid;\n  v_biz jsonb;\n  v_id uuid := gen_random_uuid();\n  v_ref text;\n  v_status text;\n  v_pay text;\n  v_chars text := 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n  i int;\nbegin\n  select owner_id, data into v_owner, v_biz from businesses where id = p_business_id;\n  if v_owner is null then raise exception 'NOT_FOUND'; end if;\n  if coalesce(v_biz->>'active', 'true') = 'false' then raise exception 'INACTIVE'; end if;\n  if coalesce(p_booking#>>'{customer,name}', '') = '' or coalesce(p_booking#>>'{customer,phone}', '') = '' then\n    raise exception 'MISSING_CUSTOMER';\n  end if;\n  if p_blocks is null or array_length(p_blocks, 1) is null or array_length(p_blocks, 1) > 96 then\n    raise exception 'BAD_TIME';\n  end if;\n  if p_proof is not null and length(p_proof) > 900000 then raise exception 'PROOF_TOO_BIG'; end if;\n\n  v_ref := 'PB-';\n  for i in 1..6 loop\n    v_ref := v_ref || substr(v_chars, 1 + floor(random() * length(v_chars))::int, 1);\n  end loop;\n\n  v_status := case when coalesce(v_biz->>'autoConfirm', 'false') = 'true' then 'confirmed' else 'pending' end;\n  v_pay := case\n    when p_booking#>>'{payment,option}' = 'later' then 'pay_later'\n    when p_proof is not null or coalesce(p_booking#>>'{payment,reference}', '') <> '' then 'for_verification'\n    else 'unpaid' end;\n\n  insert into bookings (id, business_id, owner_id, ref, date, start_time, status, payment_status, data)\n  values (v_id, p_business_id, v_owner, v_ref, p_booking->>'date', p_booking->>'start', v_status, v_pay,\n          p_booking || jsonb_build_object('id', v_id, 'ref', v_ref, 'status', v_status,\n                                          'paymentStatus', v_pay, 'hasProof', p_proof is not null,\n                                          'createdAt', now()));\n\n  begin\n    insert into slot_locks (business_id, date, staff_key, block, booking_id)\n    select p_business_id, p_booking->>'date', p_staff_key, b, v_id from unnest(p_blocks) as b;\n  exception when unique_violation then\n    raise exception 'SLOT_TAKEN';\n  end;\n\n  if p_proof is not null then\n    insert into proofs (booking_id, owner_id, data_url) values (v_id, v_owner, p_proof);\n  end if;\n\n  return jsonb_build_object('id', v_id, 'ref', v_ref, 'status', v_status, 'paymentStatus', v_pay);\nend;\n$$;\n\ngrant execute on function public.create_booking(uuid, jsonb, text, text[], text) to anon, authenticated;\n\n-- When a booking is cancelled, its time opens up again automatically.\ncreate or replace function public.release_locks() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if new.status in ('cancelled') and old.status is distinct from new.status then\n    delete from slot_locks where booking_id = new.id;\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists release_locks_trg on public.bookings;\ncreate trigger release_locks_trg after update on public.bookings\nfor each row execute function public.release_locks();\n\n-- =====================================================================\n-- PART 2: PAHINA ORDERS + STOCK (tables start with po_)\n-- =====================================================================\n\n-- =============================================================\n-- v1.4: Client Apps (a separate login for each client)\n-- You build a booking app for a client, then give them their own login.\n-- A client can only open the businesses you shared with them.\n-- =============================================================\ncreate table if not exists public.biz_members (\n  business_id uuid not null references public.businesses(id) on delete cascade,\n  email text not null check (email = lower(email)),\n  created_at timestamptz not null default now(),\n  primary key (business_id, email)\n);\nalter table public.biz_members enable row level security;\n\ncreate or replace function public.pb_email() returns text\nlanguage sql stable as $$\n  select lower(coalesce(auth.jwt() ->> 'email', ''));\n$$;\n\n-- True when the logged-in account created this business.\ncreate or replace function public.pb_owns(p_biz uuid) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from businesses where id = p_biz and owner_id = auth.uid());\n$$;\n\n-- True for the owner, and for a client the owner shared this business with.\ncreate or replace function public.pb_can(p_biz uuid) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from businesses where id = p_biz and owner_id = auth.uid())\n      or (pb_email() <> '' and exists (select 1 from biz_members where business_id = p_biz and email = pb_email()));\n$$;\n\ngrant execute on function public.pb_email() to anon, authenticated;\ngrant execute on function public.pb_owns(uuid) to anon, authenticated;\ngrant execute on function public.pb_can(uuid) to anon, authenticated;\n\n-- Only the owner adds or removes client logins. A client can see their own row.\ndrop policy if exists \"mem read\" on public.biz_members;\ncreate policy \"mem read\" on public.biz_members for select to authenticated using (pb_owns(business_id) or email = pb_email());\ndrop policy if exists \"mem insert\" on public.biz_members;\ncreate policy \"mem insert\" on public.biz_members for insert to authenticated with check (pb_owns(business_id));\ndrop policy if exists \"mem delete\" on public.biz_members;\ncreate policy \"mem delete\" on public.biz_members for delete to authenticated using (pb_owns(business_id));\n\n-- A client can edit the business shared with them, but can never take it over or delete it.\ndrop policy if exists \"biz update\" on public.businesses;\ncreate policy \"biz update\" on public.businesses for update to authenticated using (pb_can(id)) with check (pb_can(id));\n\ncreate or replace function public.pb_keep_owner() returns trigger\nlanguage plpgsql as $$\nbegin\n  new.owner_id := old.owner_id;\n  return new;\nend;\n$$;\ndrop trigger if exists pb_keep_owner_trg on public.businesses;\ncreate trigger pb_keep_owner_trg before update on public.businesses\nfor each row execute function public.pb_keep_owner();\n\n-- Bookings and payment proofs: the owner, plus the client of that business.\ndrop policy if exists \"bk read\" on public.bookings;\ncreate policy \"bk read\" on public.bookings for select to authenticated using (pb_can(business_id));\ndrop policy if exists \"bk update\" on public.bookings;\ncreate policy \"bk update\" on public.bookings for update to authenticated using (pb_can(business_id)) with check (pb_can(business_id));\ndrop policy if exists \"bk delete\" on public.bookings;\ncreate policy \"bk delete\" on public.bookings for delete to authenticated using (pb_can(business_id));\n\ncreate or replace function public.pb_keep_booking() returns trigger\nlanguage plpgsql as $$\nbegin\n  new.business_id := old.business_id;\n  new.owner_id := old.owner_id;\n  return new;\nend;\n$$;\ndrop trigger if exists pb_keep_booking_trg on public.bookings;\ncreate trigger pb_keep_booking_trg before update on public.bookings\nfor each row execute function public.pb_keep_booking();\n\ndrop policy if exists \"proof read\" on public.proofs;\ncreate policy \"proof read\" on public.proofs for select to authenticated\n  using (exists (select 1 from public.bookings b where b.id = booking_id and pb_can(b.business_id)));\n\n-- =============================================================\n-- PAHINA ORDERS + STOCK \u2014 Supabase setup\n-- Paste ALL of this into Supabase > SQL Editor > New query, then click Run.\n-- Safe to run again: it will not delete your data.\n-- Works side by side with Pahina Book in the same project (all tables start with po_).\n-- =============================================================\n\ncreate extension if not exists pgcrypto;\n\ncreate table if not exists public.po_shops (\n  id uuid primary key default gen_random_uuid(),\n  owner_id uuid not null default auth.uid() references auth.users(id) on delete cascade,\n  slug text not null unique,\n  data jsonb not null default '{}'::jsonb,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\ncreate table if not exists public.po_private (\n  shop_id uuid primary key references public.po_shops(id) on delete cascade,\n  owner_id uuid not null default auth.uid(),\n  data jsonb not null default '{}'::jsonb\n);\n\ncreate table if not exists public.po_stock (\n  shop_id uuid not null references public.po_shops(id) on delete cascade,\n  product_id text not null,\n  branch_id text not null,\n  qty numeric not null default 0,\n  updated_at timestamptz not null default now(),\n  primary key (shop_id, product_id, branch_id)\n);\n\ncreate table if not exists public.po_orders (\n  id uuid primary key default gen_random_uuid(),\n  shop_id uuid not null references public.po_shops(id) on delete cascade,\n  owner_id uuid not null,\n  ref text not null,\n  channel text not null default 'online',\n  status text not null default 'new',\n  payment_status text not null default 'unpaid',\n  branch_id text not null default '',\n  total numeric not null default 0,\n  stock_deducted boolean not null default false,\n  data jsonb not null default '{}'::jsonb,\n  created_at timestamptz not null default now(),\n  unique (shop_id, ref)\n);\ncreate index if not exists po_orders_shop_idx on public.po_orders (shop_id, created_at desc);\n\ncreate table if not exists public.po_proofs (\n  order_id uuid primary key references public.po_orders(id) on delete cascade,\n  owner_id uuid not null,\n  data_url text not null\n);\n\ncreate table if not exists public.po_audit (\n  id bigserial primary key,\n  shop_id uuid not null references public.po_shops(id) on delete cascade,\n  owner_id uuid not null default auth.uid(),\n  at timestamptz not null default now(),\n  actor text not null default '',\n  action text not null default '',\n  detail text not null default ''\n);\ncreate index if not exists po_audit_shop_idx on public.po_audit (shop_id, at desc);\n\n-- helper: is the person logged in the owner of this shop?\n-- v1.2: Client Apps. You build an order app for a client, then give them their own login.\ncreate table if not exists public.po_members (\n  shop_id uuid not null references public.po_shops(id) on delete cascade,\n  email text not null check (email = lower(email)),\n  created_at timestamptz not null default now(),\n  primary key (shop_id, email)\n);\n\ncreate or replace function public.po_email() returns text\nlanguage sql stable as $$\n  select lower(coalesce(auth.jwt() ->> 'email', ''));\n$$;\n\n-- True only for the account that created the shop.\ncreate or replace function public.po_owns(p_shop uuid) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from po_shops where id = p_shop and owner_id = auth.uid());\n$$;\n\n-- True for the account that created the shop, and for a client it was shared with.\ncreate or replace function public.po_is_owner(p_shop uuid) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from po_shops where id = p_shop and owner_id = auth.uid())\n      or (po_email() <> '' and exists (select 1 from po_members where shop_id = p_shop and email = po_email()));\n$$;\n\nalter table public.po_shops enable row level security;\nalter table public.po_private enable row level security;\nalter table public.po_stock enable row level security;\nalter table public.po_orders enable row level security;\nalter table public.po_proofs enable row level security;\nalter table public.po_audit enable row level security;\n\n-- Shops: anyone can view (customers need the menu), only the owner can change.\ndrop policy if exists \"po shop read\" on public.po_shops;\ncreate policy \"po shop read\" on public.po_shops for select using (true);\ndrop policy if exists \"po shop insert\" on public.po_shops;\ncreate policy \"po shop insert\" on public.po_shops for insert to authenticated with check (owner_id = auth.uid());\ndrop policy if exists \"po shop update\" on public.po_shops;\ncreate policy \"po shop update\" on public.po_shops for update to authenticated using (po_is_owner(id)) with check (po_is_owner(id));\ndrop policy if exists \"po shop delete\" on public.po_shops;\ncreate policy \"po shop delete\" on public.po_shops for delete to authenticated using (owner_id = auth.uid());\n\n-- Private settings (team PINs): owner only.\ndrop policy if exists \"po private all\" on public.po_private;\ncreate policy \"po private all\" on public.po_private for all to authenticated\n  using (po_is_owner(shop_id)) with check (po_is_owner(shop_id));\n\n-- Stock: anyone can see what is available, only the owner can change counts.\ndrop policy if exists \"po stock read\" on public.po_stock;\ncreate policy \"po stock read\" on public.po_stock for select using (true);\ndrop policy if exists \"po stock insert\" on public.po_stock;\ncreate policy \"po stock insert\" on public.po_stock for insert to authenticated with check (po_is_owner(shop_id));\ndrop policy if exists \"po stock update\" on public.po_stock;\ncreate policy \"po stock update\" on public.po_stock for update to authenticated using (po_is_owner(shop_id)) with check (po_is_owner(shop_id));\ndrop policy if exists \"po stock delete\" on public.po_stock;\ncreate policy \"po stock delete\" on public.po_stock for delete to authenticated using (po_is_owner(shop_id));\n\n-- Orders: owner only. Customers place orders through po_place_order().\ndrop policy if exists \"po order read\" on public.po_orders;\ncreate policy \"po order read\" on public.po_orders for select to authenticated using (po_is_owner(shop_id));\ndrop policy if exists \"po order update\" on public.po_orders;\ncreate policy \"po order update\" on public.po_orders for update to authenticated using (po_is_owner(shop_id)) with check (po_is_owner(shop_id));\ndrop policy if exists \"po order delete\" on public.po_orders;\ncreate policy \"po order delete\" on public.po_orders for delete to authenticated using (po_is_owner(shop_id));\n\n-- Payment proofs: owner only.\ndrop policy if exists \"po proof read\" on public.po_proofs;\ncreate policy \"po proof read\" on public.po_proofs for select to authenticated\n  using (exists (select 1 from public.po_orders o where o.id = order_id and po_is_owner(o.shop_id)));\n\n-- Audit log: owner only.\ndrop policy if exists \"po audit read\" on public.po_audit;\ncreate policy \"po audit read\" on public.po_audit for select to authenticated using (po_is_owner(shop_id));\ndrop policy if exists \"po audit insert\" on public.po_audit;\ncreate policy \"po audit insert\" on public.po_audit for insert to authenticated with check (po_is_owner(shop_id));\n\ngrant select on public.po_shops, public.po_stock to anon, authenticated;\ngrant select, insert, update, delete on public.po_shops, public.po_private, public.po_stock, public.po_orders, public.po_audit to authenticated;\ngrant select on public.po_proofs to authenticated;\ngrant usage, select on sequence public.po_audit_id_seq to authenticated;\n\n-- =============================================================\n-- One safe door for every order (online and cashier).\n-- Prices come from YOUR product list, never from the customer.\n-- Stock is taken in the same step, so two people can never buy the last piece.\n-- =============================================================\ncreate or replace function public.po_place_order(\n  p_shop_id uuid,\n  p_order jsonb,\n  p_proof text default null\n) returns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  v_owner uuid;\n  v_shop jsonb;\n  v_is_owner boolean;\n  v_channel text;\n  v_branch text;\n  v_item jsonb;\n  v_prod jsonb;\n  v_qty numeric;\n  v_price numeric;\n  v_tracked boolean;\n  v_items jsonb := '[]'::jsonb;\n  v_sub numeric := 0;\n  v_fee numeric := 0;\n  v_disc numeric := 0;\n  v_total numeric;\n  v_ref text;\n  v_status text;\n  v_pay text;\n  v_id uuid := gen_random_uuid();\n  v_chars text := 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n  v_ord jsonb;\n  v_try int := 0;\n  i int;\nbegin\n  select owner_id, data into v_owner, v_shop from po_shops where id = p_shop_id;\n  if v_owner is null then raise exception 'NOT_FOUND'; end if;\n  v_is_owner := auth.uid() is not null and po_is_owner(p_shop_id);\n  v_channel := case when v_is_owner and p_order->>'channel' = 'pos' then 'pos' else 'online' end;\n\n  if coalesce(jsonb_typeof(p_order->'items'), '') <> 'array' or jsonb_array_length(p_order->'items') = 0 then raise exception 'EMPTY_CART'; end if;\n  if jsonb_array_length(p_order->'items') > 100 then raise exception 'TOO_MANY_ITEMS'; end if;\n\n  if v_channel = 'online' then\n    if coalesce(v_shop->>'active', 'true') = 'false' then raise exception 'INACTIVE'; end if;\n    if coalesce(p_order#>>'{customer,name}', '') = '' or coalesce(p_order#>>'{customer,phone}', '') = '' then\n      raise exception 'MISSING_CUSTOMER';\n    end if;\n    v_branch := coalesce(nullif(v_shop#>>'{ordering,branchId}', ''), v_shop#>>'{branches,0,id}', 'main');\n  else\n    v_branch := coalesce(nullif(p_order->>'branchId', ''), v_shop#>>'{branches,0,id}', 'main');\n  end if;\n\n  if p_proof is not null and length(p_proof) > 900000 then raise exception 'PROOF_TOO_BIG'; end if;\n\n  for v_item in select * from jsonb_array_elements(p_order->'items') loop\n    v_qty := coalesce((v_item->>'qty')::numeric, 0);\n    if v_qty <= 0 or v_qty > 9999 then raise exception 'BAD_QTY'; end if;\n    select x into v_prod from jsonb_array_elements(v_shop->'products') x where x->>'id' = v_item->>'productId' limit 1;\n    if v_prod is null then raise exception 'ITEM_GONE'; end if;\n    if v_channel = 'online' and (coalesce(v_prod->>'active', 'true') = 'false' or coalesce(v_prod->>'online', 'true') = 'false') then\n      raise exception 'ITEM_GONE:%', v_prod->>'name';\n    end if;\n    v_price := coalesce((v_prod->>'price')::numeric, 0);\n    if v_channel = 'pos' and v_item ? 'price' then v_price := greatest(0, (v_item->>'price')::numeric); end if;\n    v_tracked := coalesce(v_prod->>'trackStock', 'true') <> 'false';\n    if v_tracked then\n      update po_stock set qty = qty - v_qty, updated_at = now()\n        where shop_id = p_shop_id and product_id = v_prod->>'id' and branch_id = v_branch and qty >= v_qty;\n      if not found then raise exception 'OUT_OF_STOCK:%', v_prod->>'name'; end if;\n    end if;\n    v_items := v_items || jsonb_build_object('productId', v_prod->>'id', 'name', v_prod->>'name', 'price', v_price,\n      'cost', coalesce((v_prod->>'cost')::numeric, 0), 'qty', v_qty, 'tracked', v_tracked,\n      'category', coalesce(v_prod->>'category', ''));\n    v_sub := v_sub + v_price * v_qty;\n  end loop;\n\n  if v_channel = 'online' then\n    if coalesce((v_shop#>>'{ordering,minOrder}')::numeric, 0) > v_sub then raise exception 'MIN_ORDER'; end if;\n    if p_order#>>'{fulfillment,type}' = 'delivery' then\n      v_fee := coalesce((v_shop#>>'{ordering,deliveryFee}')::numeric, 0);\n      if coalesce((v_shop#>>'{ordering,freeOver}')::numeric, 0) > 0 and v_sub >= (v_shop#>>'{ordering,freeOver}')::numeric then v_fee := 0; end if;\n    end if;\n  else\n    v_disc := least(v_sub, greatest(0, coalesce((p_order->>'discount')::numeric, 0)));\n  end if;\n  v_total := v_sub + v_fee - v_disc;\n\n  if v_channel = 'pos' then\n    v_status := 'completed'; v_pay := 'paid';\n  else\n    v_status := case when coalesce(v_shop#>>'{ordering,autoConfirm}', 'false') = 'true' then 'confirmed' else 'new' end;\n    v_pay := case\n      when p_order#>>'{payment,method}' = 'cod' then 'cod'\n      when p_proof is not null or coalesce(p_order#>>'{payment,reference}', '') <> '' then 'for_verification'\n      else 'unpaid' end;\n  end if;\n\n  loop\n    v_ref := 'PO-';\n    for i in 1..6 loop v_ref := v_ref || substr(v_chars, 1 + floor(random() * length(v_chars))::int, 1); end loop;\n    exit when not exists (select 1 from po_orders where shop_id = p_shop_id and ref = v_ref);\n    v_try := v_try + 1; if v_try > 8 then raise exception 'TRY_AGAIN'; end if;\n  end loop;\n\n  v_ord := p_order || jsonb_build_object('id', v_id, 'ref', v_ref, 'shopId', p_shop_id, 'channel', v_channel,\n    'branchId', v_branch, 'items', v_items, 'subtotal', v_sub, 'deliveryFee', v_fee, 'discount', v_disc,\n    'total', v_total, 'status', v_status, 'paymentStatus', v_pay, 'hasProof', p_proof is not null,\n    'stockDeducted', true, 'createdAt', now());\n\n  insert into po_orders (id, shop_id, owner_id, ref, channel, status, payment_status, branch_id, total, stock_deducted, data)\n  values (v_id, p_shop_id, v_owner, v_ref, v_channel, v_status, v_pay, v_branch, v_total, true, v_ord);\n\n  if p_proof is not null then\n    insert into po_proofs (order_id, owner_id, data_url) values (v_id, v_owner, p_proof);\n  end if;\n\n  return jsonb_build_object('id', v_id, 'ref', v_ref, 'status', v_status, 'paymentStatus', v_pay,\n    'items', v_items, 'subtotal', v_sub, 'deliveryFee', v_fee, 'discount', v_disc, 'total', v_total,\n    'branchId', v_branch, 'channel', v_channel, 'createdAt', now());\nend;\n$$;\n\ngrant execute on function public.po_place_order(uuid, jsonb, text) to anon, authenticated;\n\n-- When an order is cancelled, its items go back to stock automatically.\ncreate or replace function public.po_restock() returns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare v_item jsonb;\nbegin\n  if new.status = 'cancelled' and old.status is distinct from 'cancelled' and old.stock_deducted then\n    for v_item in select * from jsonb_array_elements(coalesce(old.data->'items', '[]'::jsonb)) loop\n      if coalesce(v_item->>'tracked', 'true') <> 'false' then\n        insert into po_stock (shop_id, product_id, branch_id, qty)\n        values (old.shop_id, v_item->>'productId', old.branch_id, (v_item->>'qty')::numeric)\n        on conflict (shop_id, product_id, branch_id) do update set qty = po_stock.qty + excluded.qty, updated_at = now();\n      end if;\n    end loop;\n    new.stock_deducted := false;\n    new.data := jsonb_set(new.data, '{stockDeducted}', 'false'::jsonb);\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists po_restock_trg on public.po_orders;\ncreate trigger po_restock_trg before update on public.po_orders\nfor each row execute function public.po_restock();\n\n-- Owner stock changes (receive, count, transfer). Adds or sets in one safe step.\ncreate or replace function public.po_adjust_stock(p_shop_id uuid, p_product text, p_branch text, p_delta numeric, p_set numeric default null)\nreturns numeric\nlanguage plpgsql security definer set search_path = public as $$\ndeclare v_qty numeric;\nbegin\n  if not po_is_owner(p_shop_id) then raise exception 'NOT_OWNER'; end if;\n  insert into po_stock (shop_id, product_id, branch_id, qty)\n  values (p_shop_id, p_product, p_branch, greatest(0, coalesce(p_set, p_delta)))\n  on conflict (shop_id, product_id, branch_id) do update\n    set qty = greatest(0, coalesce(p_set, po_stock.qty + p_delta)), updated_at = now()\n  returning qty into v_qty;\n  return v_qty;\nend;\n$$;\n\ngrant execute on function public.po_adjust_stock(uuid, text, text, numeric, numeric) to authenticated;\n\n-- Customers can check their order status with the shop link + reference. No names or numbers come out.\ncreate or replace function public.po_track_order(p_slug text, p_ref text) returns jsonb\nlanguage sql stable security definer set search_path = public as $$\n  select jsonb_build_object('ref', o.ref, 'status', o.status, 'paymentStatus', o.payment_status, 'total', o.total,\n    'createdAt', o.created_at, 'fulfillment', o.data->'fulfillment',\n    'items', (select coalesce(jsonb_agg(jsonb_build_object('name', x->>'name', 'qty', x->'qty')), '[]'::jsonb) from jsonb_array_elements(o.data->'items') x))\n  from po_orders o join po_shops s on s.id = o.shop_id\n  where s.slug = lower(p_slug) and o.ref = upper(trim(p_ref)) and o.channel = 'online'\n  limit 1;\n$$;\n\ngrant execute on function public.po_track_order(text, text) to anon, authenticated;\n\n-- =============================================================\n-- v1.2: Client Apps (a separate login for each client)\n-- A client can only open the shops you shared with them.\n-- =============================================================\nalter table public.po_members enable row level security;\ngrant execute on function public.po_email() to anon, authenticated;\ngrant execute on function public.po_owns(uuid) to anon, authenticated;\n\n-- Only the account that created the shop adds or removes client logins. A client can see their own row.\ndrop policy if exists \"po mem read\" on public.po_members;\ncreate policy \"po mem read\" on public.po_members for select to authenticated using (po_owns(shop_id) or email = po_email());\ndrop policy if exists \"po mem insert\" on public.po_members;\ncreate policy \"po mem insert\" on public.po_members for insert to authenticated with check (po_owns(shop_id));\ndrop policy if exists \"po mem delete\" on public.po_members;\ncreate policy \"po mem delete\" on public.po_members for delete to authenticated using (po_owns(shop_id));\n\n-- A client can run the shop shared with them, but can never take it over or delete it.\ncreate or replace function public.po_keep_owner() returns trigger\nlanguage plpgsql as $$\nbegin\n  new.owner_id := old.owner_id;\n  return new;\nend;\n$$;\ndrop trigger if exists po_keep_owner_trg on public.po_shops;\ncreate trigger po_keep_owner_trg before update on public.po_shops\nfor each row execute function public.po_keep_owner();\n\ncreate or replace function public.po_keep_order() returns trigger\nlanguage plpgsql as $$\nbegin\n  new.shop_id := old.shop_id;\n  new.owner_id := old.owner_id;\n  return new;\nend;\n$$;\ndrop trigger if exists po_keep_order_trg on public.po_orders;\ncreate trigger po_keep_order_trg before update on public.po_orders\nfor each row execute function public.po_keep_order();\n\n\n-- =====================================================================\n-- PART 3: PAHINA AI (multi-bot chatbot)\n-- =====================================================================\n\n-- =====================================================================\n-- Pahina AI \u2014 MULTI-BOT database setup (Supabase)\n--\n-- Works for a NEW install and to UPGRADE an older install.\n-- Safe to run again and again: it never deletes your products, leads,\n-- chats or settings. Your current bot becomes \"First bot\" (the default)\n-- in the My Bots list.\n--\n-- How: Supabase Dashboard -> SQL Editor -> New query -> paste all -> Run\n--\n-- NEW INSTALL only: change the email on the line that has\n-- PUT-YOUR-ADMIN-EMAIL-HERE (Pahina Connect does this for you).\n-- UPGRADE: leave that line as it is; your existing owner email stays.\n-- =====================================================================\n\n-- 1) Owner / admin (one email) ---------------------------------------\ncreate table if not exists public.app_admin (email text primary key);\nalter table public.app_admin enable row level security;   -- no policy = nobody can read it from a browser\n\ninsert into public.app_admin (email)\nselect e from (select lower(btrim('PUT-YOUR-ADMIN-EMAIL-HERE@example.com')) as e) x\nwhere e not like 'put-your-admin-email-here%'\non conflict do nothing;\n\ncreate or replace function public.is_admin() returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.app_admin where email = lower(coalesce(auth.jwt() ->> 'email', '')));\n$$;\n\n-- 2) Bots --------------------------------------------------------------\ncreate table if not exists public.bots (\n  id         uuid primary key default gen_random_uuid(),\n  name       text not null default 'New bot' check (char_length(name) between 1 and 120),\n  is_default boolean not null default false,\n  created_at timestamptz not null default now()\n);\ncreate unique index if not exists bots_only_one_default on public.bots (is_default) where is_default;\n\n-- Clients who can edit one bot (optional, for freelancers)\ncreate table if not exists public.bot_members (\n  bot_id     uuid not null references public.bots(id) on delete cascade,\n  email      text not null check (char_length(email) between 3 and 200),\n  created_at timestamptz not null default now(),\n  primary key (bot_id, email)\n);\n\ncreate or replace function public.default_bot_id() returns uuid\nlanguage sql stable security definer set search_path = public as $$\n  select id from public.bots order by is_default desc, created_at asc limit 1;\n$$;\n\n-- 3) Data tables (every row has a bot_id) -------------------------------\ncreate table if not exists public.configs (          -- PUBLIC settings of each bot\n  bot_id uuid not null default public.default_bot_id() references public.bots(id) on delete cascade,\n  key    text not null,\n  value  text,\n  primary key (bot_id, key)\n);\n\ncreate table if not exists public.products (\n  id            uuid primary key default gen_random_uuid(),\n  bot_id        uuid not null default public.default_bot_id() references public.bots(id) on delete cascade,\n  name          text not null,\n  price         text,\n  description   text,\n  display_order int  default 0\n);\n\ncreate table if not exists public.conversations (\n  id             uuid primary key default gen_random_uuid(),\n  bot_id         uuid not null default public.default_bot_id() references public.bots(id) on delete cascade,\n  started_at     timestamptz not null default now(),\n  messages_count int not null default 0,\n  lead_captured  boolean not null default false\n);\n\ncreate table if not exists public.leads (\n  id         uuid primary key default gen_random_uuid(),\n  bot_id     uuid not null default public.default_bot_id() references public.bots(id) on delete cascade,\n  name       text not null check (char_length(name) <= 120),\n  email      text not null check (char_length(email) <= 200),\n  phone      text check (char_length(phone) <= 60),\n  status     text not null default 'new',\n  created_at timestamptz not null default now()\n);\n\ncreate table if not exists public.secrets (          -- PRIVATE: Gemini keys. A browser can never read them.\n  key   text primary key,\n  value text\n);\n\n-- 4) MIGRATION from an older single-bot install ------------------------\n-- 4a) Make sure there is at least one bot, and one default\ndo $$\ndeclare nm text;\nbegin\n  if not exists (select 1 from public.bots) then\n    begin\n      execute 'select nullif(btrim(value), '''') from public.configs where key = ''brandName'' limit 1' into nm;\n    exception when others then nm := null;\n    end;\n    insert into public.bots (name, is_default) values (left(coalesce(nm, 'First bot'), 120), true);\n  elsif not exists (select 1 from public.bots where is_default) then\n    update public.bots set is_default = true\n    where id = (select id from public.bots order by created_at limit 1);\n  end if;\nend $$;\n\n-- 4b) Add bot_id to older tables; old data goes to the default bot\ndo $$\ndeclare t text;\nbegin\n  foreach t in array array['configs', 'products', 'conversations', 'leads'] loop\n    execute format('alter table public.%I add column if not exists bot_id uuid', t);\n    execute format('update public.%I set bot_id = public.default_bot_id() where bot_id is null', t);\n    execute format('alter table public.%I alter column bot_id set default public.default_bot_id()', t);\n    execute format('alter table public.%I alter column bot_id set not null', t);\n    if not exists (\n      select 1 from pg_constraint\n      where conrelid = format('public.%I', t)::regclass and contype = 'f'\n        and confrelid = 'public.bots'::regclass\n    ) then\n      execute format('alter table public.%I add constraint %I foreign key (bot_id) references public.bots(id) on delete cascade', t, t || '_bot_id_fkey');\n    end if;\n    execute format('create index if not exists %I on public.%I (bot_id)', t || '_bot_id_idx', t);\n  end loop;\nend $$;\n\n-- 4c) configs: the primary key was \"key\" only; now it is (bot_id, key)\ndo $$\ndeclare pk text; cols int;\nbegin\n  select conname, array_length(conkey, 1) into pk, cols\n  from pg_constraint where conrelid = 'public.configs'::regclass and contype = 'p';\n  if pk is not null and cols = 1 then\n    execute format('alter table public.configs drop constraint %I', pk);\n    pk := null;\n  end if;\n  if pk is null then\n    alter table public.configs add primary key (bot_id, key);\n  end if;\nend $$;\n\n-- 5) Access helpers -----------------------------------------------------\ncreate or replace function public.is_bot_admin(p_bot uuid) returns boolean\nlanguage sql stable security definer set search_path = public as $$\n  select public.is_admin() or exists (\n    select 1 from public.bot_members m\n    where m.bot_id = p_bot\n      and m.email = lower(coalesce(auth.jwt() ->> 'email', ''))\n  );\n$$;\n\n-- 'owner' = you; 'member' = a client you gave access to; null = none\ncreate or replace function public.my_role() returns text\nlanguage sql stable security definer set search_path = public as $$\n  select case\n    when public.is_admin() then 'owner'\n    when exists (select 1 from public.bot_members where email = lower(coalesce(auth.jwt() ->> 'email', ''))) then 'member'\n    else null end;\n$$;\n\n-- Find the bot from the link's ?tid=. If missing or wrong, use the default bot.\ncreate or replace function public.resolve_bot(p_tid text) returns uuid\nlanguage plpgsql stable security definer set search_path = public as $$\ndeclare b uuid;\nbegin\n  if coalesce(p_tid, '') ~* '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' then\n    select id into b from public.bots where id = p_tid::uuid;\n  end if;\n  return coalesce(b, public.default_bot_id());\nend $$;\n\n-- 6) Row Level Security -------------------------------------------------\nalter table public.bots          enable row level security;\nalter table public.bot_members   enable row level security;\nalter table public.configs       enable row level security;\nalter table public.products      enable row level security;\nalter table public.conversations enable row level security;\nalter table public.leads         enable row level security;\nalter table public.secrets       enable row level security;\n\n-- bots: the owner has full access; a client only sees the bots shared with them\ndrop policy if exists bots_owner       on public.bots;\ndrop policy if exists bots_member_read on public.bots;\ncreate policy bots_owner       on public.bots for all    to authenticated using (public.is_admin()) with check (public.is_admin());\ncreate policy bots_member_read on public.bots for select to authenticated using (public.is_bot_admin(id));\n\n-- bot_members: owner only\ndrop policy if exists members_owner on public.bot_members;\ncreate policy members_owner on public.bot_members for all to authenticated using (public.is_admin()) with check (public.is_admin());\n\n-- configs and products: anyone can read (public bot settings); only the owner or the bot's client can write\ndrop policy if exists configs_read  on public.configs;\ndrop policy if exists configs_write on public.configs;\ncreate policy configs_read  on public.configs for select to anon, authenticated using (true);\ncreate policy configs_write on public.configs for all    to authenticated using (public.is_bot_admin(bot_id)) with check (public.is_bot_admin(bot_id));\n\ndrop policy if exists products_read  on public.products;\ndrop policy if exists products_write on public.products;\ncreate policy products_read  on public.products for select to anon, authenticated using (true);\ncreate policy products_write on public.products for all    to authenticated using (public.is_bot_admin(bot_id)) with check (public.is_bot_admin(bot_id));\n\n-- conversations and leads: owner or the bot's client only. Visitors go through the functions below.\ndrop policy if exists conv_admin  on public.conversations;\ndrop policy if exists leads_admin on public.leads;\ncreate policy conv_admin  on public.conversations for all to authenticated using (public.is_bot_admin(bot_id)) with check (public.is_bot_admin(bot_id));\ncreate policy leads_admin on public.leads         for all to authenticated using (public.is_bot_admin(bot_id)) with check (public.is_bot_admin(bot_id));\n\n-- secrets: NO policy. Only the server function (service role) and the functions below have access.\n\ngrant select on public.configs, public.products to anon, authenticated;\ngrant select, insert, update, delete on public.bots, public.bot_members, public.configs, public.products, public.conversations, public.leads to authenticated;\n\n-- 7) Functions for visitors -----------------------------------------\ndrop function if exists public.start_conversation();\ncreate or replace function public.start_conversation(p_bot uuid default null) returns uuid\nlanguage plpgsql security definer set search_path = public as $$\ndeclare new_id uuid; b uuid;\nbegin\n  select id into b from public.bots where id = p_bot;\n  insert into public.conversations (bot_id) values (coalesce(b, public.default_bot_id())) returning id into new_id;\n  return new_id;\nend $$;\n\ndrop function if exists public.submit_lead(text, text, text, uuid);\ncreate or replace function public.submit_lead(p_name text, p_email text, p_phone text, p_conversation uuid default null, p_bot uuid default null)\nreturns void language plpgsql security definer set search_path = public as $$\ndeclare b uuid;\nbegin\n  if p_name is null or btrim(p_name) = '' or p_email is null or p_email !~ '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$' then\n    raise exception 'invalid lead';\n  end if;\n  if p_conversation is not null then\n    select bot_id into b from public.conversations where id = p_conversation;\n  end if;\n  if b is null then select id into b from public.bots where id = p_bot; end if;\n  b := coalesce(b, public.default_bot_id());\n  insert into public.leads (bot_id, name, email, phone)\n  values (b, left(btrim(p_name), 120), left(btrim(p_email), 200), left(coalesce(p_phone, ''), 60));\n  if p_conversation is not null then\n    update public.conversations set lead_captured = true where id = p_conversation and bot_id = b;\n  end if;\nend $$;\n\n-- 8) Secrets (Gemini keys) ----------------------------------------------\n--   gemini_key / gemini_model            = SHARED, for all bots (owner only)\n--   gemini_key:<bot id> / gemini_model:<bot id> = for one bot only (owner or the bot's client)\ncreate or replace function public.can_manage_secret(p_key text) returns boolean\nlanguage plpgsql stable security definer set search_path = public as $$\ndeclare m text[];\nbegin\n  if public.is_admin() then return true; end if;\n  m := regexp_match(coalesce(p_key, ''), '^gemini_(key|model):([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$');\n  if m is null then return false; end if;\n  return public.is_bot_admin(m[2]::uuid);\nend $$;\n\ncreate or replace function public.set_secret(p_key text, p_value text)\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if not public.can_manage_secret(p_key) or char_length(coalesce(p_key, '')) > 100 then raise exception 'not allowed'; end if;\n  insert into public.secrets (key, value) values (p_key, left(coalesce(p_value, ''), 4000))\n  on conflict (key) do update set value = excluded.value;\nend $$;\n\ncreate or replace function public.has_secret(p_key text) returns boolean\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if not public.can_manage_secret(p_key) then return false; end if;\n  return exists (select 1 from public.secrets where key = p_key and coalesce(value, '') <> '');\nend $$;\n\n-- 9) Bot management (owner only) ----------------------------------------\ncreate or replace function public.create_bot(p_name text) returns uuid\nlanguage plpgsql security definer set search_path = public as $$\ndeclare new_id uuid;\nbegin\n  if not public.is_admin() then raise exception 'not allowed'; end if;\n  insert into public.bots (name, is_default)\n  values (left(coalesce(nullif(btrim(coalesce(p_name, '')), ''), 'New bot'), 120),\n          not exists (select 1 from public.bots where is_default))\n  returning id into new_id;\n  return new_id;\nend $$;\n\ncreate or replace function public.set_default_bot(p_bot uuid) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if not public.is_admin() then raise exception 'not allowed'; end if;\n  if not exists (select 1 from public.bots where id = p_bot) then raise exception 'bot not found'; end if;\n  update public.bots set is_default = false where is_default and id <> p_bot;\n  update public.bots set is_default = true where id = p_bot;\nend $$;\n\ncreate or replace function public.delete_bot(p_bot uuid) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare was_default boolean;\nbegin\n  if not public.is_admin() then raise exception 'not allowed'; end if;\n  select is_default into was_default from public.bots where id = p_bot;\n  if was_default is null then raise exception 'bot not found'; end if;\n  if (select count(*) from public.bots) <= 1 then raise exception 'You cannot delete your last bot.'; end if;\n  delete from public.secrets where key in ('gemini_key:' || p_bot::text, 'gemini_model:' || p_bot::text);\n  delete from public.bots where id = p_bot;   -- this also deletes its configs, products, chats and leads\n  if was_default then\n    update public.bots set is_default = true where id = (select id from public.bots order by created_at limit 1);\n  end if;\nend $$;\n\n-- 10) Function permissions ------------------------------------------\nrevoke all on function public.is_admin()                                     from public;\nrevoke all on function public.default_bot_id()                               from public;\nrevoke all on function public.is_bot_admin(uuid)                             from public;\nrevoke all on function public.my_role()                                      from public;\nrevoke all on function public.resolve_bot(text)                              from public;\nrevoke all on function public.start_conversation(uuid)                       from public;\nrevoke all on function public.submit_lead(text, text, text, uuid, uuid)      from public;\nrevoke all on function public.can_manage_secret(text)                        from public;\nrevoke all on function public.set_secret(text, text)                         from public;\nrevoke all on function public.has_secret(text)                               from public;\nrevoke all on function public.create_bot(text)                               from public;\nrevoke all on function public.set_default_bot(uuid)                          from public;\nrevoke all on function public.delete_bot(uuid)                               from public;\n\ngrant execute on function public.is_admin()                                  to anon, authenticated;\ngrant execute on function public.default_bot_id()                            to anon, authenticated;\ngrant execute on function public.is_bot_admin(uuid)                          to authenticated;\ngrant execute on function public.my_role()                                   to anon, authenticated;\ngrant execute on function public.resolve_bot(text)                           to anon, authenticated;\ngrant execute on function public.start_conversation(uuid)                    to anon, authenticated;\ngrant execute on function public.submit_lead(text, text, text, uuid, uuid)   to anon, authenticated;\ngrant execute on function public.set_secret(text, text)                      to authenticated;\ngrant execute on function public.has_secret(text)                            to authenticated;\ngrant execute on function public.create_bot(text)                            to authenticated;\ngrant execute on function public.set_default_bot(uuid)                       to authenticated;\ngrant execute on function public.delete_bot(uuid)                            to authenticated;\n\n-- Refresh the API so it sees the new functions right away\n\n\n-- Done! You should see \"Success. No rows returned\".\n\n-- =====================================================================\n-- DONE: refresh the API so the apps see the new tables right away\n-- =====================================================================\n-- Table permissions. New Supabase projects no longer add these by default.\n-- Row Level Security above still decides which rows each person can see.\ngrant usage on schema public to anon, authenticated;\ngrant select on public.businesses, public.slot_locks to anon, authenticated;\ngrant select, insert, update, delete on public.businesses, public.bookings, public.slot_locks, public.proofs, public.biz_members to authenticated;\ngrant select, insert, update, delete on public.po_members to authenticated;\ngrant all on all tables in schema public to service_role;\ngrant all on all sequences in schema public to service_role;\n\nnotify pgrst, 'reload schema';\n\nselect 'Pahina Suite is ready: Book, Orders + Stock and AI' as result;\n";
const CHAT_FN = "// Pahina AI — \"chat\" Edge Function (MULTI-BOT version) v1.3\n// v1.3: works with the new secret keys and tells the setup check exactly what is missing.\n// v1.2: current Gemini models (2.5 is legacy), works with AQ. keys, and reports Google's real error.\n// The Gemini key is kept here. A visitor's browser never sees it.\n// Each bot has its own settings and products (bot_id). A Gemini key can be\n// for one bot only (gemini_key:<bot id>) or shared (gemini_key).\n// Deploy: Supabase Dashboard -> Edge Functions -> Create function -> name: chat -> paste this file -> Deploy.\nimport { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';\n\nconst CORS = {\n  'Access-Control-Allow-Origin': '*',\n  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',\n  'Access-Control-Allow-Methods': 'POST, OPTIONS',\n};\nconst MAX_TURNS = 12;          // how many recent messages are sent to the AI\nconst MAX_CHARS = 1000;        // max length of each message\nconst MAX_PER_CHAT = 60;       // message limit per conversation (protects your quota)\n// Tried in this order. Old models (2.0 / 2.5 / previews) are skipped because new keys cannot use them.\nconst DEFAULT_MODELS = ['gemini-flash-latest', 'gemini-3.5-flash-lite', 'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.1-flash-lite'];\nconst OLD_MODEL = /gemini-(1\\.|2\\.0|2\\.5)|preview|exp/i;\nconst UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;\n\nfunction json(body: unknown, status = 200) {\n  // \"v\" lets Pahina Connect see which version of this code is deployed\n  return new Response(JSON.stringify({ v: '1.3', ...(body as object) }), { status, headers: { ...CORS, 'Content-Type': 'application/json' } });\n}\n\nconst PERSONALITY: Record<string, string> = {\n  friendly: 'Friendly, warm and casual. Short sentences.',\n  professional: 'Professional and polite. Clear and formal.',\n  playful: 'Playful and energetic, but still helpful and respectful.',\n  expert: 'Calm, expert and confident. Give specific, practical answers.',\n};\n\nfunction buildPrompt(cfg: Record<string, string>, products: any[]) {\n  const brand = cfg.brandName || 'our business';\n  const bot = cfg.botName || 'the assistant';\n  const lang = cfg.lang === 'tl'\n    ? 'Reply in natural, modern Taglish (Filipino + English) unless the customer writes fully in English.'\n    : 'Reply in the same language the customer uses (English by default).';\n\n  const productLines = (products || []).map((p) =>\n    `- ${p.name}${p.price ? ` — ${p.price}` : ''}${p.description ? `\\n  ${String(p.description).replace(/\\n/g, '\\n  ')}` : ''}`).join('\\n') || '(no products listed yet)';\n\n  let pay = '';\n  try {\n    const m = JSON.parse(cfg.payMethods || '[]');\n    pay = m.map((x: any) => x.type === 'paypal'\n      ? `- PayPal: ${x.link}`\n      : `- ${String(x.type).toUpperCase()}: ${x.number}${x.name ? ` (account name: ${x.name})` : ''}`).join('\\n');\n  } catch (_) { /* ignore */ }\n  if (cfg.payInstructions) pay += `${pay ? '\\n' : ''}- Notes: ${cfg.payInstructions}`;\n\n  return [\n    `You are ${bot}, the AI sales and customer-support assistant of \"${brand}\".`,\n    cfg.businessDesc ? `About the business: ${cfg.businessDesc}` : '',\n    `Personality: ${PERSONALITY[cfg.botPersonality] || PERSONALITY.friendly}`,\n    lang,\n    '',\n    'PRODUCTS / SERVICES (the ONLY source of truth for what is sold and for prices):',\n    productLines,\n    '',\n    pay ? `PAYMENT METHODS:\\n${pay}` : 'PAYMENT METHODS: (none listed — ask the customer to leave their details so the owner can follow up).',\n    '',\n    cfg.faqs ? `FAQ:\\n${cfg.faqs}` : '',\n    cfg.botExtra ? `OWNER INSTRUCTIONS:\\n${cfg.botExtra}` : '',\n    '',\n    'RULES:',\n    '- Answer using only the information above. Never invent prices, discounts, stock, delivery times or policies. If you do not know, say you will have the owner follow up and invite the customer to tap \"Leave details is not set up yet. Please let the page owner know.', error_detail: { stage: 'database', message: dbErr } });\n\n  // Find out which bot is being chatted with\n  const convId = typeof body.conversation_id === 'string' && UUID_RE.test(body.conversation_id) ? body.conversation_id : null;\n  let botId: string | null = null;\n  let conv: { messages_count: number } | null = null;\n  if (convId) {\n    const { data: c } = await admin.from('conversations').select('bot_id,messages_count').eq('id', convId).maybeSingle();\n    if (c) { conv = c; botId = c.bot_id; }\n  }\n  if (!botId && typeof body.bot_id === 'string' && UUID_RE.test(body.bot_id)) {\n    const { data: b } = await admin.from('bots').select('id').eq('id', body.bot_id).maybeSingle();\n    if (b) botId = b.id;\n  }\n  if (!botId) {\n    const { data: d } = await admin.from('bots').select('id').order('is_default', { ascending: false }).order('created_at', { ascending: true }).limit(1).maybeSingle();\n    if (d) botId = d.id;\n  }\n  if (!botId) return json({ reply: 'This chatbot is not set up yet. Please let the page owner know.', error_detail: { stage: 'bots', message: 'No bot found. Run the engine again (it makes your first bot).' } });\n\n  // limit per conversation + count the messages\n  if (conv) {\n    if (conv.messages_count >= MAX_PER_CHAT) {\n      return json({ reply: 'We have covered a lot! Please tap \"Leave details\" so we can contact you directly. Thank you!' });\n    }\n    await admin.from('conversations').update({ messages_count: conv.messages_count + 1 }).eq('id', convId);\n  }\n\n  const [{ data: cfgRows }, { data: products }, { data: sec, error: secErr }] = await Promise.all([\n    admin.from('configs').select('key,value').eq('bot_id', botId),\n    admin.from('products').select('name,price,description').eq('bot_id', botId).order('display_order', { ascending: true }),\n    admin.from('secrets').select('key,value').in('key', ['gemini_key', 'gemini_model', `gemini_key:${botId}`, `gemini_model:${botId}`]),\n  ]);\n  const cfg: Record<string, string> = {};\n  (cfgRows || []).forEach((r: any) => { cfg[r.key] = r.value; });\n  const secrets: Record<string, string> = {};\n  (sec || []).forEach((r: any) => { secrets[r.key] = String(r.value || '').trim(); });\n\n  // the bot's own key first; if none, the shared key\n  const key = secrets[`gemini_key:${botId}`] || secrets.gemini_key || '';\n  const preferredModel = secrets[`gemini_model:${botId}`] || secrets.gemini_model || '';\n  if (!key) return json({ reply: 'The AI is not set up yet. Please let the page owner know.', error_detail: { stage: 'key', message: secErr ? ((secErr.code ? secErr.code + ' ' : '') + secErr.message).slice(0, 200) : 'No Gemini key saved yet.' } });\n\n  const payload = JSON.stringify({\n    systemInstruction: { parts: [{ text: buildPrompt(cfg, products || []) }] },\n    contents,\n    generationConfig: { temperature: 0.6, maxOutputTokens: 2048 },  // room for the model's thinking plus the reply\n  });\n\n  const models = await pickModel(key, preferredModel);\n  const errors: any[] = [];\n  for (const model of models) {\n    try {\n      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {\n        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: payload,\n      });\n      if (!r.ok) {\n        const g = await googleError(r, model);\n        errors.push(g);\n        if (keyLevel(g)) break;   // bad key, blocked project or region: stop here\n        continue;                 // model not found or busy: try the next one\n      }\n      const d = await r.json();\n      const text = d?.candidates?.[0]?.content?.parts?.map((p: any) => p.text || '').join('').trim();\n      if (text) {\n        if (convId) {\n          const { data: c2 } = await admin.from('conversations').select('messages_count').eq('id', convId).maybeSingle();\n          if (c2) await admin.from('conversations').update({ messages_co function rail() {
  $('rail').innerHTML = STEPS.map((s, i) => {
    const cls = i === S.step ? 'on' : (S.done[i] ? 'done' : '');
    return '<li class="' + cls + '" data-i="' + i + '"><span class="n">' + (S.done[i] && i !== S.step ? '&#10003;' : (i + 1)) + '</span>' + esc(s.t) + '</li>';
  }).join('');
  $('rail').querySelectorAll('li.done').forEach((li) => li.addEventListener('click', () => go(+li.dataset.i)));
  $('mprogTxt').textContent = 'Step ' + (S.step + 1) + ' of ' + STEPS.length + ' · ' + STEPS[S.step].t;
  const left = MINUTES.slice(S.step).reduce((a, b) => a + b, 0);
  $('mprogLeft').textContent = S.step === STEPS.length - 1 ? 'All done' : (left > 0 ? 'About ' + left + ' min left' : '');
  $('mbar').style.width = ((S.step + 1) / STEPS.length * 100) + '%';
}
function go(i) { S.step = Math.max(0, Math.min(STEPS.length - 1, i)); save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function finish(i) { S.done[i] = 1; go(i + 1); }
function nav(i, opts) {

}
